name: Release LightImage for macOS

on:
  push:
    branches: [main]
    paths:
      - Resources/Info.plist
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightimage-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hwo63/LightImage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      epoch: ${{ steps.version.outputs.epoch }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the version and previous release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')
          pattern='^[0-9]{2}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo "::error::CFBundleShortVersionString must be YY.major.patch."
            exit 1
          fi

          published=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          previous=$(printf '%s\n' "$published" | sed -nE 's/^v([0-9]{2}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [[ -n "$previous" ]]; then
            newest=$(printf '%s\n' "$previous" "$version" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
            if [[ "$newest" == "$previous" ]]; then
              echo "Version $version is already published or older than $previous."
              exit 0
            fi
            if ! git merge-base --is-ancestor "v$previous" "$GITHUB_SHA"; then
              echo "::error::The previous release tag must be an ancestor of the release commit."
              exit 1
            fi
          fi

          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag" && [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag points to a different commit."
            exit 1
          fi

          {
            printf 'version=%s\ntag=%s\nprevious=%s\n' "$version" "$tag" "$previous"
            printf 'epoch=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")"
            printf 'publish=true\n'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      LIGHTIMAGE_BUILD_EPOCH: ${{ needs.prepare.outputs.epoch }}
      LIGHTIMAGE_UPDATE_PUBLIC_KEY: ${{ vars.LIGHTIMAGE_UPDATE_PUBLIC_KEY }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test and package LightImage
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -n "$LIGHTIMAGE_UPDATE_PUBLIC_KEY"
          ./scripts/test.sh
          ./scripts/package-release.sh
          for executable in LightImage LightImageInstaller; do
            test "$(lipo -archs "dist/LightImage.app/Contents/MacOS/$executable")" = "$EXPECTED_ARCH"
          done

      - name: Save both installer formats
        uses: actions/upload-artifact@v4
        with:
          name: LightImage-${{ matrix.arch }}
          path: dist/releases/${{ needs.prepare.outputs.version }}/
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      LIGHTIMAGE_BUILD_EPOCH: ${{ needs.prepare.outputs.epoch }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download both architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: LightImage-*
          merge-multiple: true
          path: dist/releases/${{ needs.prepare.outputs.version }}

      - name: Create release notes and sign both updates
        shell: bash
        env:
          LIGHTIMAGE_UPDATE_PRIVATE_KEY: ${{ secrets.LIGHTIMAGE_UPDATE_PRIVATE_KEY }}
          EXPECTED_UPDATE_PUBLIC_KEY: ${{ vars.LIGHTIMAGE_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$LIGHTIMAGE_UPDATE_PRIVATE_KEY" || -z "$EXPECTED_UPDATE_PUBLIC_KEY" ]]; then
            echo "::error::Configure the LightImage updater signing secret and public key variable before releasing."
            exit 1
          fi
          key=$(swift scripts/sign-update.swift --public-key)
          if [[ "$key" != "$EXPECTED_UPDATE_PUBLIC_KEY" ]]; then
            echo "::error::The configured update signing keys do not match."
            exit 1
          fi
          release="dist/releases/$VERSION"
          stamp=$(TZ=Asia/Ho_Chi_Minh date -r "$LIGHTIMAGE_BUILD_EPOCH" '+%d%m.%H%M%S')
          for arch in arm64 x86_64; do
            name="LightImage-$VERSION-$stamp-macOS-$arch"
            test -s "$release/$name.dmg"
            swift scripts/sign-update.swift "$VERSION" "$arch" "$release/$name.app.zip" "$release"
          done
          printf 'BUILD_STAMP=%s\n' "$stamp" >> "$GITHUB_ENV"

          range=("$GITHUB_SHA")
          if [[ -n "$PREVIOUS" ]]; then range=("v$PREVIOUS..$GITHUB_SHA"); fi
          {
            printf '## LightImage %s (build %s)\n\n' "$VERSION" "$stamp"
            printf '### Các thay đổi\n\n'
            git log --no-merges --format='- %s (`%h`)' "${range[@]}"
            if [[ -n "$PREVIOUS" ]]; then
              printf '\n[Xem toàn bộ thay đổi](https://github.com/%s/compare/v%s...v%s)\n' "$GITHUB_REPOSITORY" "$PREVIOUS" "$VERSION"
            fi
            printf '\n### Cài đặt\n\n'
            printf 'Cần macOS 14 trở lên. Chọn tệp có hậu tố phù hợp với máy.\n\n'
            printf '%s\n' '- **Apple Silicon** — chọn `macOS-arm64.dmg` hoặc `macOS-arm64.app.zip`.'
            printf '%s\n' '- **Intel** — chọn `macOS-x86_64.dmg` hoặc `macOS-x86_64.app.zip`.'
            printf '\nMở DMG và kéo LightImage vào Applications, hoặc giải nén ZIP rồi chuyển ứng dụng vào Applications.\n\n'
            printf 'Bản cài ký ad-hoc. Nếu macOS chặn mở bản tải về, xem [hướng dẫn mở LightImage lần đầu](https://github.com/%s#mở-lần-đầu-nếu-macos-chặn-lightimage).\n' "$GITHUB_REPOSITORY"
          } > "$release/Release.md"

      - name: Publish GitHub Release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="dist/releases/$VERSION"
          title="LightImage $VERSION (build $BUILD_STAMP)"
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.draft, .target_commitish] | @tsv")
          if [[ -z "$draft" ]]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$title" --notes-file "$release/Release.md"
          elif [[ "$draft" != "true"$'\t'"$GITHUB_SHA" ]]; then
            echo "::error::A release with this tag already exists outside this build."
            exit 1
          fi
          assets=("$release/Release.md")
          for arch in arm64 x86_64; do
            name="LightImage-$VERSION-$BUILD_STAMP-macOS-$arch"
            assets+=("$release/$name.dmg" "$release/$name.app.zip"
                     "$release/LightImage-update-$arch.json" "$release/LightImage-update-$arch.sig")
          done
          gh release upload "$TAG" --clobber "${assets[@]}"
          gh release edit "$TAG" --draft=false --prerelease=false --latest --title "$title" --notes-file "$release/Release.md"
